[project]
name = "google-ads-mcp"
description = "Hosted MCP server for Google Ads reporting and guarded offline conversion uploads"
version = "0.1.0"
requires-python = ">=3.10"
license = "Apache-2.0"
readme = "README.md"
dependencies = [
    "google-auth>=2.40.0,<3",
    "mcp>=1.28.1,<2",
    "PyJWT[crypto]>=2.10.1,<3",
    "requests>=2.32.0,<3",
    "starlette>=0.47.0,<1",
    "uvicorn>=0.35.0,<1",
]
keywords = ["google ads", "adwords", "gclid", "offline conversions", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
google-ads-mcp = "google_ads_mcp.server:run_server"
google-ads-mcp-http = "google_ads_mcp.remote_server:run_remote_server"

[project.optional-dependencies]
dev = ["black>=25.1.0,<27", "coverage>=7.10.0,<8"]

[build-system]
requires = ["setuptools>=80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

